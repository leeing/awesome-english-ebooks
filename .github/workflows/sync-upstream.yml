name: Sync Upstream

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 不做完整 checkout，用 GitHub API 先尝试无冲突合并
      - name: Try merge-upstream API
        id: api_sync
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/merge-upstream \
            -d '{"branch":"master"}')
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "http_code=$HTTP_CODE" >> "$GITHUB_OUTPUT"
          echo "Response: $BODY"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Synced via API"
          elif [ "$HTTP_CODE" = "409" ]; then
            echo "⚠️ Conflicts detected, will use git merge fallback"
          else
            echo "ℹ️ Status: $HTTP_CODE"
          fi

      # 只在 API 合并失败（409）时才做完整 git checkout + merge
      - name: Checkout fork (fallback)
        if: steps.api_sync.outputs.http_code == '409'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch and merge upstream (fallback)
        if: steps.api_sync.outputs.http_code == '409'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 保存 fork 独有的文件（上游不存在的）
          cp .github/workflows/sync-upstream.yml /tmp/sync-upstream.yml.bak

          git remote add upstream https://github.com/hehonghui/awesome-english-ebooks.git
          git fetch upstream master

          git merge -s recursive -X theirs --allow-unrelated-histories upstream/master \
            -m "chore: auto-sync upstream $(date -u +%Y-%m-%d)" || true

          # 恢复 fork 独有的 workflow 文件
          mkdir -p .github/workflows
          cp /tmp/sync-upstream.yml.bak .github/workflows/sync-upstream.yml

          # 清理所有残留 conflict markers（排除 workflow 文件自身）
          CONFLICT_FILES=$(grep -rl '<<<<<<< HEAD' . 2>/dev/null | grep -v '.github/workflows/sync-upstream.yml' || true)
          if [ -n "$CONFLICT_FILES" ]; then
            echo "Fixing residual conflict markers in:"
            echo "$CONFLICT_FILES"
            while IFS= read -r f; do
              git checkout upstream/master -- "$f" 2>/dev/null || true
            done <<< "$CONFLICT_FILES"
          fi

          git add -A
          # 如果有变更则 commit（merge 可能已经自动 commit）
          git diff --cached --quiet || git commit -m "fix: resolve conflicts and restore fork files"

          git push origin master
